<div class="container w-50 mt-5">
  <form #formCreate="ngForm" (ngSubmit)="onSubmit(formCreate.value)" class="form form-control mt-2"> <!-- // form module -->
    <strong>Form Create Product</strong>

    <!-- *** remember get value from tags *** just mapped the name  before mapped have to mark ngModel attribute in input text field. -->
    <div class="form-floating mb-3">
      <input ngModel name="image" type="url"  class="form-control" placeholder="Images Urls..." >
      <label >Image Urls</label>
    </div>

    <div class="form-floating mb-3">
      <input ngModel name="title" type="text" class="form-control" placeholder="title..."  >
      <label >Title</label>
    </div>

    <div class="form-floating mb-3">
      <input ngModel name="description"  type="text" class="form-control" placeholder="description..." >
      <label>Description</label>
    </div>

    <div class="form-floating mb-3">
      <input ngModel name="price" type="number" class="form-control" placeholder="price..." >
      <label>Price</label>
    </div>

    <div class="form-control">
      <strong>Category</strong>
      <!-- (change)="" work after input changes -->
      <ng-container *ngFor="let data of categories">
        <div class="form-check">
          <input  ngModel name="category" [value]="data.value"  [id]="data.id" class="form-check-input" type="radio" >
          <label class="form-check-label" [for]="data.id">
            {{ data.label }}
          </label>
        </div>
      </ng-container>
    </div>

    <button type="submit" class="btn btn-secondary mt-2">Submit</button>
  </form>
</div>
